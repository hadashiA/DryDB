<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 279" width="800" height="279" role="img" aria-label="Range scan benchmark">
  <rect x="0.5" y="0.5" width="799" height="278" rx="8" fill="#1a1a19" stroke="#33322f"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="24" y="30" font-size="15" font-weight="600" fill="#ffffff">Range scan</text>
    <text x="24" y="48" font-size="11.5" fill="#c3c2b7">Read 100 consecutive rows by key range — time per query (lower is better)</text>
    <line x1="262" y1="58" x2="262" y2="240" stroke="#3a3936" stroke-width="1"/>
  <text x="250" y="75" text-anchor="end" dominant-baseline="central" font-size="12" fill="#c3c2b7">DryDB</text>
  <path d="M262 64 h14.52 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-14.52 Z" fill="#3987e5"/>
  <text x="288.52" y="75" dominant-baseline="central" font-size="12" font-weight="600" fill="#ffffff">0.4 µs</text>
  <text x="250" y="112" text-anchor="end" dominant-baseline="central" font-size="12" fill="#c3c2b7">LMDB (LightningDB)</text>
  <path d="M262 101 h35.41 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-35.41 Z" fill="#8d8c82"/>
  <text x="309.414" y="112" dominant-baseline="central" font-size="12" font-weight="600" fill="#ffffff">1.0 µs</text>
  <text x="250" y="149" text-anchor="end" dominant-baseline="central" font-size="12" fill="#c3c2b7">SQLite (CsSqlite, prepared + immutable)</text>
  <path d="M262 138 h201.86 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-201.86 Z" fill="#8d8c82"/>
  <text x="475.858" y="149" dominant-baseline="central" font-size="12" font-weight="600" fill="#ffffff">5.7 µs</text>
  <text x="250" y="186" text-anchor="end" dominant-baseline="central" font-size="12" fill="#c3c2b7">RocksDB</text>
  <path d="M262 175 h308.10 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-308.10 Z" fill="#8d8c82"/>
  <text x="582.099" y="186" dominant-baseline="central" font-size="12" font-weight="600" fill="#ffffff">8.7 µs</text>
  <text x="250" y="223" text-anchor="end" dominant-baseline="central" font-size="12" fill="#c3c2b7">SQLite (CsSqlite, default)</text>
  <path d="M262 212 h361.22 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-361.22 Z" fill="#8d8c82"/>
  <text x="635.22" y="223" dominant-baseline="central" font-size="12" font-weight="600" fill="#ffffff">10.2 µs</text>
    <text x="24" y="267" font-size="10.5" fill="#8a897f">BenchmarkDotNet · .NET 10 · Apple M-series · 10,000 rows (int64 key, 13-byte value) · 4 KB pages</text>
  </g>
</svg>
